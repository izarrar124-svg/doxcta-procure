<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows & Glow" subtitle="Card rest/hover, button glow, highlight ring" -->

<body>
<div class="b" style="box-shadow:var(--shadow-card)">card rest</div>
<div class="b" style="box-shadow:var(--shadow-card-hover)">card hover</div>
<div class="b" style="box-shadow:var(--shadow-button);background:var(--color-lime-500);color:#07110d">btn glow</div>
<div class="b" style="box-shadow:var(--shadow-glow)">highlight ring</div>
</body></html>
